name: CI - Pull Request Verification & Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'Images/**'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checks:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform (without backend)
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform validate

  backend-ci:
    name: Backend Lint, Tests & SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev unixodbc-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov bandit safety

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=venv

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r . -x ./tests,./venv -ll -ii || true

      - name: Run Unit Tests with Pytest
        env:
          TESTING: "True"
        run: |
          pytest tests/ -v

  frontend-ci:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

      - name: Build Frontend (Dry-Run / Production Asset Validation)
        run: npm run build
        env:
          VITE_API_URL: "https://api.example.com"

  security-scan:
    name: Container & Dependency Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image for Scanning
        run: |
          docker build -t ecommerce-backend:scan ./Backend

      - name: Run Trivy Vulnerability Scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-backend:scan'
          format: 'table'
          exit-code: '0' # Audit mode; set to 1 to block on HIGH/CRITICAL in strict production
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Filesystem Scan on Repository
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
